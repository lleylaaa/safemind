<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeMind</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <!-- Welkom scherm -->
  <div id="welcome-screen">
    <h1>SafeMind</h1>
    <p>Welkom! Klik op de knop om te starten.</p>
    <button id="startBtn">Welkom</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <header>
      <h1>SafeMind Dashboard</h1>
      <nav id="menu">
        <button data-screen="mood-screen">Mood</button>
        <button data-screen="sleep-screen">Slaap</button>
        <button data-screen="overview-screen">Overzicht</button>
      </nav>
    </header>

    <main>
      <!-- Mood scherm -->
      <section id="mood-screen" class="screen">
        <h2>Hoe voel je je vandaag?</h2>
        <div id="mood-buttons">
          <button data-mood="😊">😊</button>
          <button data-mood="😐">😐</button>
          <button data-mood="😔">😔</button>
        </div>
        <textarea id="note" placeholder="Schrijf een notitie over je dag"></textarea>
        <button id="saveMood">Opslaan</button>
      </section>

      <!-- Sleep scherm -->
      <section id="sleep-screen" class="screen" style="display:none;">
        <h2>Hoe heb je geslapen?</h2>
        <div id="sleep-buttons">
          <button data-sleep="😴">😴 Goed</button>
          <button data-sleep="😐">😐 Gemiddeld</button>
          <button data-sleep="😵‍💫">😵‍💫 Slecht</button>
        </div>
        <button id="saveSleep">Opslaan</button>
      </section>

      <!-- Overzicht scherm -->
      <section id="overview-screen" class="screen" style="display:none;">
        <h2>Overzicht van moods en slaap</h2>
        <div id="graph"></div>
        <canvas id="weeklyChart" width="400" height="200"></canvas>
      </section>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
